# HTTP
quarkus.http.port=8080
quarkus.http.auth.proactive=false

# CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:8000,http://localhost:8085
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# MySQL
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${THAKI_DB_USER:root}
quarkus.datasource.password=${THAKI_DB_PASSWORD}
quarkus.datasource.jdbc.url=${THAKI_DB_URL:jdbc:mysql://localhost:3306/thaki_modificado?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/La_Paz&characterEncoding=UTF-8}
quarkus.datasource.jdbc.driver=com.mysql.cj.jdbc.Driver

# Hibernate
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=false
%dev.quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.bind-parameters=false

# OpenAPI / Swagger
quarkus.smallrye-openapi.path=/api/docs
quarkus.swagger-ui.always-include=true

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.thakivoyage".level=INFO
%dev.quarkus.log.category."com.thakivoyage".level=DEBUG
quarkus.log.category."com.thakivoyage.actividad".handlers=actividad
quarkus.log.category."com.thakivoyage.actividad".use-parent-handlers=false
quarkus.log.handler.file.actividad.enabled=true
quarkus.log.handler.file.actividad.path=logs/actividad.log
quarkus.log.handler.file.actividad.encoding=UTF-8
quarkus.log.handler.file.actividad.format=%d{yyyy-MM-dd HH:mm:ssXXX} %-5p %s%n
quarkus.log.handler.file.actividad.rotation.max-file-size=10M
quarkus.log.handler.file.actividad.rotation.max-backup-index=5
quarkus.log.handler.file.actividad.rotation.rotate-on-boot=false
%test.quarkus.log.handler.file.actividad.path=target/actividad-test.log
